<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>황정민 필모그래피 퀴즈</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@300;400;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a0a; color: #f0f0f0;
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; padding: 40px 20px;
  }
  h1 {
    font-family: 'Black Han Sans', sans-serif;
    font-size: clamp(1.6rem, 4vw, 2.6rem);
    letter-spacing: 0.05em; color: #fff;
    margin-bottom: 6px; text-align: center;
  }
  .subtitle { font-size: 0.85rem; color: #888; margin-bottom: 40px; text-align: center; }
  .quiz-container { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 48px; }
  .question-card {
    background: #161616; border: 1px solid #2a2a2a;
    border-radius: 16px; overflow: hidden; transition: border-color 0.3s;
  }
  .question-card.correct { border-color: #4ade80; }
  .question-card.wrong { border-color: #f87171; }
  .q-number { padding: 14px 20px 0; font-size: 0.75rem; font-weight: 700; color: #555; letter-spacing: 0.12em; text-transform: uppercase; }
  .q-image { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; margin: 12px 0 0; }
  .input-wrap { padding: 14px 16px; display: flex; gap: 8px; }
  .ans-input {
    flex: 1; background: #1e1e1e; border: 1.5px solid #333;
    border-radius: 10px; padding: 11px 14px; color: #fff;
    font-family: 'Noto Sans KR', sans-serif; font-size: 0.9rem;
    outline: none; transition: border-color 0.2s;
  }
  .ans-input:focus { border-color: #666; }
  .ans-input:disabled { opacity: 0.5; }
  .submit-btn {
    background: #fff; color: #000; border: none; border-radius: 10px;
    padding: 11px 18px; font-family: 'Black Han Sans', sans-serif;
    font-size: 0.9rem; cursor: pointer; transition: opacity 0.2s; white-space: nowrap;
  }
  .submit-btn:hover:not(:disabled) { opacity: 0.8; }
  .submit-btn:disabled { opacity: 0.4; cursor: default; }
  .feedback { padding: 0 16px 16px; font-size: 0.82rem; min-height: 24px; color: #aaa; line-height: 1.5; }
  .feedback.ok { color: #4ade80; }
  .feedback.ng { color: #f87171; }
  .score-board {
    margin-top: 20px; text-align: center; padding: 28px;
    background: #161616; border: 1px solid #2a2a2a;
    border-radius: 16px; width: 100%; max-width: 520px; display: none;
  }
  .score-board.visible { display: block; }
  .score-num { font-family: 'Black Han Sans', sans-serif; font-size: 3.5rem; color: #fff; margin: 8px 0; }
  .score-label { color: #888; font-size: 0.9rem; }
  .retry-btn {
    margin-top: 20px; background: #fff; color: #000; border: none;
    border-radius: 8px; padding: 12px 32px;
    font-family: 'Black Han Sans', sans-serif; font-size: 1rem;
    cursor: pointer; transition: opacity 0.2s;
  }
  .retry-btn:hover { opacity: 0.85; }
</style>
</head>
<body>
<h1>황정민 필모그래피 퀴즈</h1>
<p class="subtitle">이 장면, 어떤 영화인지 직접 써봐</p>
<div class="quiz-container" id="quizContainer"></div>
<div class="score-board" id="scoreBoard">
  <div class="score-label">최종 점수</div>
  <div class="score-num" id="scoreNum"></div>
  <div class="score-label" id="scoreMsg"></div>
  <button class="retry-btn" onclick="init()">다시 풀기</button>
</div>

const BASE_QUESTIONS = [
  { img: IMG1,  answer: "베테랑" },
  { img: IMG2,  answer: "부당거래" },
  { img: IMGA1, answer: "남자가 사랑할때" },
  { img: IMGA2, answer: "남자가 사랑할때" },
  { img: IMGA3, answer: "남자가 사랑할때" },
  { img: IMGA4, answer: "남자가 사랑할때" },
  { img: IMG4,  answer: "검사외전" },
  { img: IMG5,  answer: "아수라" },
  { img: IMG6,  answer: "사생결단" },
  { img: IMG7,  answer: "열한번째 엄마" }
];

let answered = 0, score = 0, questions = [];

function shuffle(arr) {
  return [...arr].sort(() => Math.random() - 0.5);
}

function shuffleNoConsecutive(arr) {
  let result, attempts = 0;
  do {
    result = shuffle(arr);
    attempts++;
  } while (attempts < 100 && result.some((q, i) => i > 0 && q.answer === result[i-1].answer));
  return result;
}

function normalize(str) {
  return str.replace(/\s/g, '').toLowerCase();
}

function init() {
  answered = 0; score = 0;
  questions = shuffleNoConsecutive(BASE_QUESTIONS);
  document.getElementById('scoreBoard').classList.remove('visible');
  renderQuiz();
}

function renderQuiz() {
  const container = document.getElementById('quizContainer');
  container.innerHTML = '';
  questions.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = 'card' + i;
    card.innerHTML = `
      <div class="q-number">Q${i+1}</div>
      <img class="q-image" src="${q.img}" alt="영화 장면">
      <div class="input-wrap">
        <input class="ans-input" id="input${i}" type="text" placeholder="영화 제목 입력"
          onkeydown="if(event.key==='Enter') submitAnswer(${i})">
        <button class="submit-btn" id="btn${i}" onclick="submitAnswer(${i})">확인</button>
      </div>
      <div class="feedback" id="fb${i}"></div>
    `;
    container.appendChild(card);
  });
}

function submitAnswer(idx) {
  const q = questions[idx];
  const card = document.getElementById('card' + idx);
  const fb = document.getElementById('fb' + idx);
  const input = document.getElementById('input' + idx);
  const btn = document.getElementById('btn' + idx);
  const typed = input.value.trim();
  if (!typed) return;

  input.disabled = true;
  btn.disabled = true;

  const correct = normalize(typed) === normalize(q.answer);
  if (correct) {
    score++;
    card.classList.add('correct');
    fb.className = 'feedback ok';
    fb.textContent = '✓ 정답!';
  } else {
    card.classList.add('wrong');
    fb.className = 'feedback ng';
    fb.textContent = '✗ 오답. 정답: ' + q.answer;
  }

  answered++;
  if (answered === questions.length) setTimeout(showScore, 600);
}

function showScore() {
  const total = questions.length;
  const msgs = ['황정민이 누구야 😅', '조금 알긴 하네 👀', '반은 알아 🤔', '제법인데? 🎬', '거의 다 맞았네 👏', '황정민 덕후네 ㄹㅇ 🏆'];
  const idx = Math.round((score / total) * (msgs.length - 1));
  document.getElementById('scoreNum').textContent = score + ' / ' + total;
  document.getElementById('scoreMsg').textContent = msgs[idx];
  const board = document.getElementById('scoreBoard');
  board.classList.add('visible');
  board.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

init();
</script>
